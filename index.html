<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Azasha ✦</title>

    <style>

        /* =========================================================
           1. ОСНОВА
        ========================================================= */

        @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap');

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;

            -webkit-tap-highlight-color: transparent;
        }

        html {
            width: 100%;
            min-height: 100%;
            scroll-behavior: smooth;
        }

        body {
            width: 100%;
            min-height: 100vh;
            min-height: 100svh;

            overflow-x: hidden;

            font-family: "Baloo 2", sans-serif;

            color: #405443;

            background:
                radial-gradient(
                    circle at 12% 15%,
                    #FFF1B8 0,
                    transparent 27%
                ),
                radial-gradient(
                    circle at 88% 82%,
                    #DCECCB 0,
                    transparent 27%
                ),
                linear-gradient(
                    135deg,
                    #FFFDF5 0%,
                    #F7F9EE 100%
                );
        }

        button {
            font-family: inherit;
        }

        img {
            display: block;

            max-width: 100%;

            -webkit-user-drag: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }


        /* =========================================================
           2. ФОНОВЫЕ ЭЛЕМЕНТЫ
        ========================================================= */

        .blob {
            position: fixed;

            width: clamp(170px, 18vw, 260px);
            height: clamp(130px, 13vw, 180px);

            border-radius: 50%;

            pointer-events: none;

            opacity: .45;

            filter: blur(2px);

            z-index: 0;
        }

        .blob-one {
            top: -80px;
            left: -80px;

            background: #F6C85F;

            transform: rotate(-20deg);
        }

        .blob-two {
            right: -80px;
            bottom: -100px;

            background: #9BC58C;

            transform: rotate(25deg);
        }

        .decoration {
            position: fixed;

            pointer-events: none;

            z-index: 1;

            opacity: .7;
        }

        .star {
            color: #D6A93A;

            font-size: clamp(20px, 2vw, 28px);
        }

        .heart {
            color: #7FAF78;

            font-size: clamp(19px, 1.8vw, 25px);
        }

        .star-1 {
            top: 18%;
            left: 6%;
        }

        .star-2 {
            top: 30%;
            right: 6%;
        }

        .heart-1 {
            bottom: 18%;
            left: 10%;
        }

        .heart-2 {
            top: 14%;
            right: 17%;
        }


        /* =========================================================
           3. ГЛАВНЫЙ КОНТЕЙНЕР
        ========================================================= */

        .page {
            position: relative;
            z-index: 2;

            width: min(
                1400px,
                calc(100% - 48px)
            );

            height: calc(100vh - 48px);
            height: calc(100svh - 48px);

            min-height: 560px;

            margin: 24px auto;

            padding:
                clamp(24px, 3vw, 38px)
                clamp(32px, 5vw, 72px);

            border:
                1px solid
                rgba(255, 255, 255, .9);

            border-radius:
                clamp(26px, 3vw, 34px);

            background:
                rgba(255, 255, 249, .72);

            box-shadow:
                0 25px 80px
                rgba(91, 111, 70, .14);

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            overflow: hidden;
        }


        /* =========================================================
           4. NAVIGATION
        ========================================================= */

        nav {
            position: relative;
            z-index: 20;

            width: 100%;
            height: 58px;

            display: grid;

            grid-template-columns:
                minmax(150px, 1fr)
                auto
                minmax(150px, 1fr);

            align-items: center;

            gap: 20px;
        }

        .logo {
            justify-self: start;

            color: #668B5C;

            font-size: clamp(21px, 1.8vw, 27px);

            font-weight: 800;

            line-height: 1;

            white-space: nowrap;
        }

        .menu {
            display: flex;

            align-items: center;
            justify-content: center;

            gap: clamp(15px, 2.2vw, 34px);
        }

        .menu a {
            color: #536450;

            text-decoration: none;

            font-size: clamp(13px, 1.1vw, 17px);

            font-weight: 600;

            line-height: 1;

            white-space: nowrap;

            transition:
                color .25s ease,
                transform .25s ease;
        }

        .menu a:hover {
            color: #D4A72C;

            transform: translateY(-2px);
        }

        .gift-button {
            justify-self: end;

            min-height: 50px;

            padding:
                11px
                clamp(16px, 1.7vw, 24px);

            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 7px;

            border: none;
            border-radius: 30px;

            background: #E7B83E;

            color: #fff;

            font-size: clamp(13px, 1.1vw, 16px);

            font-weight: 700;

            white-space: nowrap;

            cursor: pointer;

            box-shadow:
                0 8px 20px
                rgba(231, 184, 62, .25);

            transition:
                transform .25s ease,
                box-shadow .25s ease;
        }

        .gift-button:hover {
            transform: translateY(-3px);

            box-shadow:
                0 12px 25px
                rgba(231, 184, 62, .35);
        }

        .gift-button:active {
            transform: scale(.97);
        }

        .gift-icon {
            width: 24px;
            height: 24px;

            flex: 0 0 auto;

            object-fit: contain;
        }


        /* =========================================================
           5. HERO
        ========================================================= */

        .hero {
            position: relative;

            width: 100%;

            height:
                calc(
                    100% - 58px
                );

            display: grid;

            grid-template-columns:
                minmax(0, .95fr)
                minmax(0, 1.05fr);

            align-items: stretch;

            gap: clamp(20px, 4vw, 65px);

            padding-top:
                clamp(20px, 4vh, 50px);

            overflow: visible;
        }


        /* =========================================================
           6. ТЕКСТ
        ========================================================= */

        .content {
            position: relative;
            z-index: 5;

            width: 100%;
            max-width: 610px;

            padding-left:
                clamp(0px, 2vw, 35px);

            display: flex;

            flex-direction: column;

            justify-content: center;
        }

        .date {
            margin-bottom:
                clamp(9px, 1.5vh, 17px);

            color: #709563;

            font-size: clamp(15px, 1.35vw, 19px);

            font-weight: 700;

            letter-spacing: .3px;
        }

        h1 {
            margin-bottom:
                clamp(17px, 2.4vh, 28px);

            color: #354538;

            font-size:
                clamp(
                    56px,
                    6.3vw,
                    100px
                );

            font-weight: 700;

            line-height: .82;

            letter-spacing:
                clamp(-4px, -.3vw, -2px);
        }

        h1 span {
            color: #D9A92E;
        }

        .subtitle {
            width: 100%;
            max-width: 500px;

            margin-bottom:
                clamp(22px, 3.2vh, 35px);

            color: #687765;

            font-size: clamp(16px, 1.4vw, 20px);

            line-height: 1.48;
        }


        /* =========================================================
           7. КНОПКИ
        ========================================================= */

        .buttons {
            display: flex;

            align-items: center;

            flex-wrap: wrap;

            gap: 11px;
        }

        .start,
        .about {
            min-height: 51px;

            border-radius: 30px;

            font-size: clamp(14px, 1.2vw, 17px);

            font-weight: 700;

            cursor: pointer;

            transition:
                transform .25s ease,
                background .25s ease;
        }

        .start {
            padding:
                12px
                clamp(19px, 2vw, 28px);

            border: none;

            background: #7FAF78;

            color: #fff;

            box-shadow:
                0 8px 20px
                rgba(127, 175, 120, .22);
        }

        .start:hover {
            background: #6E9D68;

            transform: translateY(-3px);
        }

        .about {
            padding:
                10px
                clamp(17px, 1.8vw, 25px);

            border:
                2px dashed
                #A8C69A;

            background: transparent;

            color: #668B5C;
        }

        .about:hover {
            background:
                rgba(168, 198, 154, .10);

            transform: translateY(-2px);
        }

        .start:active,
        .about:active {
            transform: scale(.97);
        }


        /* =========================================================
           8. ЗОНА ПЕРСОНАЖА
        ========================================================= */

        .character {
            position: relative;

            width: 100%;
            height: 100%;

            min-width: 0;
            min-height: 0;

            display: flex;

            align-items: flex-end;
            justify-content: center;

            overflow: visible;

            align-self: stretch;
        }

        .character-image {
            position: relative;
            z-index: 3;

            width:
                clamp(
                    410px,
                    42vw,
                    620px
                );

            height:
                clamp(
                    580px,
                    88vh,
                    800px
                );

            max-width: none;
            max-height: none;

            object-fit: contain;

            object-position: center bottom;

            flex: 0 0 auto;

            margin-bottom: -70px;

            filter:
                drop-shadow(
                    0 18px 25px
                    rgba(70, 50, 100, .16)
                );

            pointer-events: none;

            -webkit-user-drag: none;

            /*
             * Основная плавная анимация.
             */
            animation:
                characterFloat
                4.5s
                ease-in-out
                infinite;
        }


        /* =========================================================
           9. ПОЧТОВЫЙ ЯЩИК — КЛИКИ
        ========================================================= */

        .mailbox-image {
            cursor: pointer;
            transform-origin: center bottom;
            transition: transform .18s ease, filter .18s ease;
            will-change: transform;
        }

        .mailbox-image:hover {
            filter:
                drop-shadow(
                    0 20px 30px
                    rgba(70, 50, 100, .20)
                );
        }

        .mailbox-image.mailbox-shake {
            animation: mailboxShake .28s ease both;
        }

        .mailbox-image.mailbox-opened {
            animation: mailboxOpen .65s cubic-bezier(.2,.8,.2,1) both;
            cursor: default;
        }

        @keyframes mailboxShake {
            0% { transform: scale(var(--mailbox-scale, 1)) rotate(0deg); }
            25% { transform: scale(var(--mailbox-scale, 1)) rotate(-3deg) translateX(-5px); }
            50% { transform: scale(var(--mailbox-scale, 1)) rotate(3deg) translateX(5px); }
            75% { transform: scale(var(--mailbox-scale, 1)) rotate(-2deg) translateX(-3px); }
            100% { transform: scale(var(--mailbox-scale, 1)) rotate(0deg); }
        }

        @keyframes mailboxOpen {
            0% { transform: scale(1) translateY(0); }
            45% { transform: scale(1.12) translateY(-8px); }
            100% { transform: scale(1.02) translateY(0); }
        }

        /* =========================================================
           9. КАРТОЧКА 24 АВГУСТА
        ========================================================= */

        .birthday-card {
            position: absolute;

            z-index: 5;

            width: clamp(120px, 10vw, 150px);

            left: clamp(-5px, 1vw, 20px);

            bottom: clamp(15px, 3vh, 35px);

            padding: clamp(12px, 1.4vw, 17px);

            border-radius: 3px;

            background:
                rgba(255, 255, 249, .88);

            box-shadow:
                0 12px 30px
                rgba(91, 111, 70, .12);

            transform: rotate(-5deg);
        }

        .birthday-card strong {
            display: block;

            color: #D9A92E;

            font-size:
                clamp(
                    36px,
                    3.2vw,
                    46px
                );

            line-height: .95;
        }

        .birthday-card p {
            color: #667362;

            font-size:
                clamp(
                    12px,
                    1.05vw,
                    15px
                );

            line-height: 1.2;
        }


        /* =========================================================
           10. НОУТБУК
        ========================================================= */

        @media (max-width: 1200px) and (min-width: 901px) {

            .page {
                width: calc(100% - 32px);

                height: calc(100svh - 32px);

                margin: 16px auto;

                padding:
                    25px 38px;
            }

            nav {
                grid-template-columns:
                    170px
                    1fr
                    170px;
            }

            .menu {
                gap: 16px;
            }

            .menu a {
                font-size: 13px;
            }

            .gift-button {
                min-height: 45px;

                padding:
                    9px 13px;

                font-size: 12px;
            }

            .gift-icon {
                width: 22px;
                height: 22px;
            }

            .hero {
                gap: 20px;

                padding-top: 20px;
            }

            .content {
                padding-left: 5px;
            }

            h1 {
                font-size: 70px;
            }

            .subtitle {
                font-size: 17px;
            }

            .character-image {
                width: 430px;
                height: 570px;

                margin-bottom: -55px;
            }

            .birthday-card {
                left: -5px;
                bottom: 25px;
            }
        }


        /* =========================================================
           11. ПЛАНШЕТ
        ========================================================= */

        @media (max-width: 900px) and (min-width: 701px) {

            .page {
                width: calc(100% - 24px);

                height: calc(100svh - 24px);

                margin: 12px auto;

                padding:
                    22px 27px;
            }

            nav {
                grid-template-columns:
                    135px
                    1fr
                    145px;

                column-gap: 10px;
            }

            .menu {
                gap: 11px;
            }

            .menu a {
                font-size: 12px;
            }

            .gift-button {
                min-height: 45px;

                padding:
                    9px 13px;

                font-size: 12px;
            }

            .gift-icon {
                width: 22px;
                height: 22px;
            }

            .hero {
                gap: 10px;

                padding-top: 20px;
            }

            h1 {
                font-size: 56px;
            }

            .subtitle {
                font-size: 16px;

                max-width: 400px;
            }

            .start,
            .about {
                min-height: 47px;

                font-size: 14px;
            }

            .character-image {
                width: 335px;
                height: 455px;

                margin-bottom: -45px;
            }

            .birthday-card {
                width: 112px;

                left: 0;
                bottom: 20px;
            }

            .birthday-card strong {
                font-size: 36px;
            }

            .birthday-card p {
                font-size: 12px;
            }
        }


        /* =========================================================
           12. ТЕЛЕФОН
        ========================================================= */

        @media (max-width: 700px) {

            body {
                min-height: 100svh;
            }

            .page {
                width: calc(100% - 12px);

                height: calc(100svh - 12px);

                min-height: 0;

                margin: 6px auto;

                padding:
                    14px 14px 0;

                border-radius: 25px;

                overflow: hidden;
            }

            nav {
                height: 46px;
                min-height: 46px;

                display: flex;

                align-items: center;
                justify-content: space-between;

                gap: 10px;
            }

            .logo {
                font-size: 20px;
            }

            .menu {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                width: 100%;
                overflow-x: auto;
                scrollbar-width: none;
            }

            .menu::-webkit-scrollbar {
                display: none;
            }

            .menu a {
                flex: 0 0 auto;
                font-size: 11px;
                padding: 6px 7px;
            }

            .gift-button {
                min-height: 42px;

                padding:
                    8px 14px;

                border-radius: 24px;

                font-size: 13px;
            }

            .gift-icon {
                width: 21px;
                height: 21px;
            }


            /* -----------------------------------------------------
               HERO
            ----------------------------------------------------- */

            .hero {
                height: auto;

                min-height: 0;

                display: flex;

                flex-direction: column;

                align-items: center;

                gap: 0;

                padding-top:
                    clamp(
                        25px,
                        6vh,
                        45px
                    );

                text-align: center;

                overflow: visible;
            }


            /* -----------------------------------------------------
               TEXT
            ----------------------------------------------------- */

            .content {
                width: 100%;

                max-width: 480px;

                padding: 0;

                display: block;
            }

            .date {
                margin-bottom: 9px;

                font-size: 15px;
            }

            h1 {
                margin-bottom: 17px;

                font-size:
                    clamp(
                        48px,
                        14.5vw,
                        68px
                    );

                line-height: .85;

                letter-spacing: -2.5px;
            }

            .subtitle {
                width:
                    min(
                        90vw,
                        350px
                    );

                margin:
                    0 auto 22px;

                font-size: 15.5px;

                line-height: 1.4;
            }


            /* -----------------------------------------------------
               BUTTONS
            ----------------------------------------------------- */

            .buttons {
                justify-content: center;

                flex-wrap: nowrap;

                gap: 7px;
            }

            .start,
            .about {
                min-height: 47px;

                font-size: 13px;

                white-space: nowrap;
            }

            .start {
                padding:
                    10px
                    clamp(
                        14px,
                        4.5vw,
                        21px
                    );
            }

            .about {
                padding:
                    9px
                    clamp(
                        12px,
                        3.5vw,
                        18px
                    );
            }


            /* -----------------------------------------------------
               CHARACTER
            ----------------------------------------------------- */
            .character {
                width: 100%;

                height: 395px;
                min-height: 395px;

                margin-top: 8px;

                display: flex;
                align-items: flex-end;
                justify-content: center;

                overflow: visible;
            }

            .character-image {
                width: 300px;
                height: 390px;

                max-width: 78vw;
                max-height: 390px;

                object-fit: contain;
                object-position: center bottom;

                margin-bottom: -4px;
            }

            /* Почтовый ящик на телефоне — заметно меньше и полностью помещается */
            .mailbox-image {
                width: 300px;
                height: 390px;
                max-width: 78vw;
                max-height: 390px;

                margin-bottom: -4px;
            }

            .birthday-card {
                width: 92px;

                left: calc(50% - 132px);
                bottom: 6px;

                padding: 8px;
            }

            .birthday-card strong {
                font-size: 30px;
            }

            .birthday-card p {
                font-size: 10px;
            }




            /* -----------------------------------------------------
               MOBILE PAGE ANIMATION
            ----------------------------------------------------- */

            .page {
                animation:
                    mobilePageAppear
                    .7s
                    ease-out
                    both;
            }

            .date {
                animation:
                    mobileFadeUp
                    .6s
                    .1s
                    ease-out
                    both;
            }

            h1 {
                animation:
                    mobileFadeUp
                    .7s
                    .18s
                    ease-out
                    both;
            }

            .subtitle {
                animation:
                    mobileFadeUp
                    .7s
                    .3s
                    ease-out
                    both;
            }

            .buttons {
                animation:
                    mobileFadeUp
                    .7s
                    .42s
                    ease-out
                    both;
            }

            .birthday-card {
                animation:
                    mobileCardAppear
                    .8s
                    .8s
                    ease-out
                    both;
            }

            .star-1,
            .star-2,
            .heart-1,
            .heart-2 {
                animation:
                    mobileFloat
                    4s
                    ease-in-out
                    infinite;
            }

            .blob-one {
                animation:
                    mobileBlobOne
                    7s
                    ease-in-out
                    infinite;
            }

            .blob-two {
                animation:
                    mobileBlobTwo
                    8s
                    ease-in-out
                    infinite;
            }

            .gift-button {
                animation:
                    mobileButtonPulse
                    3.5s
                    ease-in-out
                    1s
                    infinite;
            }
        }


        /* =========================================================
           13. МАЛЕНЬКИЙ ТЕЛЕФОН
        ========================================================= */

        @media (max-width: 380px) {

            .page {
                width: calc(100% - 8px);

                height: calc(100svh - 8px);

                margin: 4px auto;

                padding:
                    12px 10px 0;

                border-radius: 22px;
            }

            nav {
                height: 42px;
                min-height: 42px;
            }

            .logo {
                font-size: 18px;
            }

            .gift-button {
                min-height: 39px;

                padding:
                    7px 11px;

                font-size: 12px;
            }

            .gift-icon {
                width: 19px;
                height: 19px;
            }

            .hero {
                padding-top: 23px;
            }

            .date {
                font-size: 14px;
            }

            h1 {
                font-size:
                    clamp(
                        44px,
                        14vw,
                        56px
                    );

                letter-spacing: -2px;

                margin-bottom: 14px;
            }

            .subtitle {
                width: 290px;

                max-width: 88vw;

                font-size: 14px;

                margin-bottom: 17px;
            }

            .buttons {
                gap: 5px;
            }

            .start,
            .about {
                min-height: 44px;

                font-size: 12px;
            }

            .start {
                padding-left: 10px;
                padding-right: 10px;
            }

            .about {
                padding-left: 9px;
                padding-right: 9px;
            }

            .character {
                height: 310px;

                margin-top: 12px;
            }

            .character-image {
                width: 255px;
                height: 330px;

                margin-bottom: -30px;
            }

            .birthday-card {
                width: 101px;

                left:
                    calc(50% - 124px);

                padding: 9px;
            }

            .birthday-card strong {
                font-size: 32px;
            }

            .birthday-card p {
                font-size: 11px;
            }
        }


        /* =========================================================
           14. НИЗКИЙ ЭКРАН ТЕЛЕФОНА
        ========================================================= */

        @media (max-width: 700px) and (max-height: 720px) {

            .hero {
                padding-top: 19px;
            }

            h1 {
                font-size:
                    clamp(
                        43px,
                        13.5vw,
                        58px
                    );

                margin-bottom: 13px;
            }

            .subtitle {
                margin-bottom: 15px;

                font-size: 14px;
            }

            .start,
            .about {
                min-height: 43px;
            }

            .character {
                height: 290px;

                margin-top: 11px;
            }

            .character-image {
                width: 235px;
                height: 305px;

                margin-bottom: -25px;
            }

            .birthday-card {
                bottom: 0;
            }
        }


        /* =========================================================
           15. ВЫСОКИЙ ТЕЛЕФОН
        ========================================================= */

    <script>

        function startCameraFreefall() {
            if (window.cameraFreefallStarted) return;
            window.cameraFreefallStarted = true;

            document.body.classList.add("camera-fall");

            const overlay = document.getElementById("cameraVignette");
            if (overlay) overlay.classList.add("active");

            const page = document.querySelector(".page");
            if (!page) return;

            const isMobile = window.matchMedia("(max-width: 700px)").matches;
            const duration = isMobile ? 620 : 720;
            const totalDistance = window.innerHeight * (isMobile ? 1.18 : 1.12);

            const startTime = performance.now();

            function frame(now) {
                const raw = Math.min((now - startTime) / duration, 1);

                // Continuous acceleration: velocity grows smoothly all the way
                // to the end. No bounce, no pauses, no separate falling stages.
                const t = raw * raw;

                const y = -totalDistance * t;

                // Blur grows smoothly with speed.
                const blur = 10 * t;
                const opacity = 1 - (0.92 * t);

                page.style.transform = `translate3d(0, ${y}px, 0)`;
                page.style.filter = `blur(${blur.toFixed(2)}px)`;
                page.style.opacity = opacity.toFixed(3);

                if (raw < 1) {
                    requestAnimationFrame(frame);
                }
            }

            requestAnimationFrame(frame);
        }


        /* =====================================================
           ЗАЩИТА ИЗОБРАЖЕНИЙ

                }

                ) {

                    event.preventDefault();

                }

            }
        );


        document.querySelectorAll("img").forEach(

                    }
                );

            }
        );


        /* =====================================================
           ПОЧТОВЫЙ ЯЩИК — ОТКРЫТИЕ ПОСЛЕ НЕСКОЛЬКИХ КЛИКОВ
        ====================================================== */

        let mailboxClicks = 0;
        let mailboxOpened = false;
        const mailboxMaxClicks = 6;

        function mailboxClick() {

            if (mailboxOpened) return;

            // Проигрываем загруженный звук стука при каждом клике.
            const knock = document.getElementById("mailboxKnock");
            if (knock) {
                knock.currentTime = 0;
                const playPromise = knock.play();
                if (playPromise) {
                    playPromise.catch(() => {});
                }
            }

            const mailbox = document.getElementById("mailbox");

            // Считаем клик здесь — поэтому ящик открывается ровно на 6-м клике.
            mailboxClicks++;

            if (mailboxClicks < mailboxMaxClicks) {

                const scale = 1 + (mailboxClicks - 1) * 0.022;

                mailbox.style.setProperty("--mailbox-scale", scale.toFixed(3));
                mailbox.style.transform = `scale(${scale})`;

                mailbox.classList.remove("mailbox-shake");
                void mailbox.offsetWidth;
                mailbox.classList.add("mailbox-shake");

                if (mailboxClicks >= 3) {
                }

                if (mailboxClicks === 5) {
                }

            } else {

                mailboxOpened = true;

                // Отдельный звук открытия — только на последнем клике.
                const openSound = document.getElementById("mailboxOpenSound");
                if (openSound) {
                    openSound.currentTime = 0;
                    const playPromise = openSound.play();
                    if (playPromise) {
                        playPromise.catch(() => {});
                    }
                }

                mailbox.classList.remove("mailbox-shake");
                mailbox.classList.add("mailbox-opened");

                setTimeout(function () {
                    mailbox.src = "pochta-open.png";
                    mailbox.alt = "Открытый почтовый ящик";
                }, 220);

                setTimeout(function () {
                    mailbox.classList.remove("mailbox-opened");
                    mailbox.style.transform = "scale(1)";
                }, 750);

                // После открытия даём немного времени рассмотреть ящик,
                // затем вниз "падает" вся первая страница целиком.
                setTimeout(function () {
                    startCameraFreefall();
                }, 1450);

                // Переходим на вторую страницу после завершения падения.
                setTimeout(function () {
                    window.location.href = "Azasha_quest_v2.html";
                }, 2250);
            }
        }

        function showDecorMessage(text) {
            const box = document.getElementById("decorMessage");
            const textBox = document.getElementById("decorMessageText");

            if (!box || !textBox) return;

            textBox.textContent = text;
            box.classList.remove("show");
            void box.offsetWidth;
            box.classList.add("show");

            clearTimeout(window.decorMessageTimer);
            window.decorMessageTimer = setTimeout(() => {
                box.classList.remove("show");
            }, 2200);
        }

            event.preventDefault();
            event.stopPropagation();
            showDecorMessage("Ты уже тут ✦");
            return false;
        }
