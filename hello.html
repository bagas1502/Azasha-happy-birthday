<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Для Микули ♡</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Baloo 2', sans-serif;
            background:
                radial-gradient(circle at 15% 20%, #e4d8ff 0 8%, transparent 25%),
                radial-gradient(circle at 85% 80%, #ffd3ed 0 7%, transparent 25%),
                linear-gradient(135deg, #eee9ff, #f9f5ff);
            color: #3d3154;
            overflow-x: hidden;
        }

        /* декоративные элементы */

        .decoration {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            opacity: .7;
        }

        .star {
            font-size: 28px;
            color: #9a83df;
        }

        .heart {
            font-size: 25px;
            color: #ed8fc1;
        }

        .star-1 {
            top: 18%;
            left: 7%;
        }

        .star-2 {
            top: 28%;
            right: 8%;
        }

        .heart-1 {
            bottom: 20%;
            left: 12%;
        }

        .heart-2 {
            top: 15%;
            right: 18%;
        }

        .blob {
            position: fixed;
            width: 260px;
            height: 180px;
            border-radius: 50%;
            filter: blur(2px);
            opacity: .45;
            z-index: 0;
        }

        .blob-one {
            background: #bca7ff;
            top: -80px;
            left: -80px;
            transform: rotate(-20deg);
        }

        .blob-two {
            background: #ffafd8;
            bottom: -100px;
            right: -80px;
            transform: rotate(25deg);
        }

        /* сайт */

        .page {
            position: relative;
            z-index: 2;
            width: min(1400px, 94%);
            min-height: 94vh;
            margin: 3vh auto;
            padding: 30px 55px;
            border-radius: 32px;
            background: rgba(255, 253, 255, .68);
            border: 1px solid rgba(255,255,255,.8);
            box-shadow: 0 25px 80px rgba(100, 75, 150, .15);
            backdrop-filter: blur(15px);
        }

        /* навигация */

        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            color: #7256a9;
        }

        .menu {
            display: flex;
            gap: 38px;
        }

        .menu a {
            text-decoration: none;
            color: #574a69;
            font-size: 16px;
            font-weight: 600;
            transition: .25s;
        }

        .menu a:hover {
            color: #e96da9;
            transform: translateY(-2px);
        }

        .gift-button {
            border: none;
            padding: 13px 23px;
            border-radius: 30px;
            background: #f05b9d;
            color: white;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(240,91,157,.25);
            transition: .25s;
        }

        .gift-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(240,91,157,.35);
        }

        /* главный экран */

        .hero {
            min-height: calc(94vh - 100px);
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            gap: 30px;
        }

        .content {
            padding-left: 50px;
        }

        .date {
            font-size: 18px;
            font-weight: 700;
            color: #8d75c9;
            margin-bottom: 15px;
        }

        h1 {
            font-size: clamp(65px, 7vw, 110px);
            line-height: .82;
            letter-spacing: -4px;
            color: #332742;
            margin-bottom: 25px;
        }

        h1 span {
            color: #ed63a2;
        }

        .subtitle {
            max-width: 500px;
            font-size: 20px;
            line-height: 1.5;
            color: #766985;
            margin-bottom: 35px;
        }

        .buttons {
            display: flex;
            gap: 15px;
        }

        .start {
            border: none;
            padding: 15px 28px;
            border-radius: 30px;
            background: #8367c7;
            color: white;
            font-family: inherit;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: .25s;
        }

        .start:hover {
            transform: translateY(-3px);
            background: #7256b5;
        }

        .about {
            padding: 14px 25px;
            border-radius: 30px;
            border: 2px dashed #b49ee5;
            background: transparent;
            color: #8067b4;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        /* место под рисунок */

        .character {
            height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .character-placeholder {
            width: 430px;
            height: 520px;
            border-radius: 45% 45% 20% 20%;
            background: linear-gradient(
                145deg,
                rgba(191,169,255,.5),
                rgba(255,183,221,.45)
            );
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8d79b5;
            font-size: 20px;
            text-align: center;
            padding: 50px;
            border: 2px dashed rgba(130,105,185,.35);
        }

        /* дата */

        .birthday-card {
            position: absolute;
            left: 30px;
            bottom: 40px;
            width: 145px;
            padding: 18px;
            background: rgba(255,255,255,.8);
            transform: rotate(-5deg);
            box-shadow: 0 12px 30px rgba(80,60,120,.12);
        }

        .birthday-card strong {
            display: block;
            font-size: 45px;
            line-height: 1;
            color: #ed63a2;
        }

        .birthday-card p {
            color: #74658b;
            font-size: 15px;
        }

        /* адаптация */

        @media (max-width: 900px) {
            .page {
                padding: 25px;
            }

            .menu {
                display: none;
            }

            .hero {
                grid-template-columns: 1fr;
                text-align: center;
            }

            .content {
                padding-left: 0;
            }

            .subtitle {
                margin-left: auto;
                margin-right: auto;
            }

            .buttons {
                justify-content: center;
            }

            .character {
                height: 450px;
            }

            .character-placeholder {
                width: 300px;
                height: 380px;
            }

            .birthday-card {
                left: 5%;
            }
        }
    </style>
</head>

<body>

    <div class="blob blob-one"></div>
    <div class="blob blob-two"></div>

    <div class="decoration star star-1">✦</div>
    <div class="decoration star star-2">✧</div>
    <div class="decoration heart heart-1">♡</div>
    <div class="decoration heart heart-2">♡</div>

    <main class="page">

        <nav>
            <div class="logo">mikulya ♡</div>

            <div class="menu">
                <a href="#">home</a>
                <a href="#">memories</a>
                <a href="#">music</a>
                <a href="#">about</a>
                <a href="#">for you ♡</a>
            </div>

            <button class="gift-button">
                🎁 open gift
            </button>
        </nav>

        <section class="hero">

            <div class="content">

                <div class="date">
                    24 / 08
                </div>

                <h1>
                    Heya!<br>
                    I'm <span>Mikulya!</span>
                </h1>

                <p class="subtitle">
                    Сегодня особенный день.
                    Поэтому я решил сделать кое-что
                    маленькое, но специально для тебя ♡
                </p>

                <div class="buttons">
                    <button class="start" onclick="startGift()">
                        ✦ начать подарок
                    </button>

                    <button class="about">
                        ♡ что это?
                    </button>
                </div>

            </div>

            <div class="character">

                <!-- СЮДА ПОТОМ ПОСТАВИМ ТВОЙ РИСУНОК -->

                <div class="character-placeholder">
                    Здесь будет твой рисунок<br>
                    Микули ♡
                </div>

                <div class="birthday-card">
                    <strong>24</strong>
                    <p>августа<br>день рождения!</p>
                </div>

            </div>

        </section>

    </main>

    <script>
        function startGift() {
            alert("А вот теперь начинается подарок ♡");
        }
    </script>

</body>
</html>
